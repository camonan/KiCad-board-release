name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Check tag matches package version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          ver=$(python -c "import json; print(json.load(open('metadata.json'))['versions'][0]['version'])")
          if [ "$tag" != "$ver" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package version $ver"
            exit 1
          fi

      - name: Build
        run: python build.py

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/*.zip \
            --title "$GITHUB_REF_NAME" \
            --generate-notes
